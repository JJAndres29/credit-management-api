name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: credit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/credit_test
      PORT: 3000
      JWT_SECRET: test-secret-minimum-64-chars-long-aaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_EXPIRES_IN: 1h
      JWT_CUSTOMER_SECRET: test-customer-secret-minimum-32-chars-long-aaaaaaaaaa
      JWT_CUSTOMER_EXPIRES_IN: 1h
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test